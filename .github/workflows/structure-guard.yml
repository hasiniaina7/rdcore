name: structure-guard

on:
  push:
  pull_request:

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run validate:structure
      - name: Block forbidden legacy directories
        run: |
          forbidden=(
            "backend-all-portal"
            "frontend-portal-deprecated"
            "infoconso-frontend-rd"
            "omada-yt-portal"
            "apps/portal-web-personalized/demo-omada-captive-portal"
            "apps/portal-web-personalized/omada-captive-portail-exemple"
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden legacy path detected: $path"
              exit 1
            fi
          done
