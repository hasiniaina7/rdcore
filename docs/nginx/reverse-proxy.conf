# Reverse proxy for Captive Portal API docs
# Copy/adjust inside /etc/nginx/sites-available/hotspot.techzone.lat

server {
    listen 80;
    server_name hotspot.techzone.lat;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hotspot.techzone.lat;

    # SSL cert/key paths (replace with your certbot/live paths)
    ssl_certificate     /etc/letsencrypt/live/hotspot.techzone.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotspot.techzone.lat/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow SPA frontend hosted elsewhere to call the backend safely
    add_header Access-Control-Allow-Origin  $http_origin  always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Accept' always;
    add_header Access-Control-Allow-Credentials 'true' always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # Proxy plain API traffic (optional but convenient)
    location /api/ {
        proxy_pass         http://127.0.0.1:4000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger UI/documentation
    location /api/docs/ {
        # Preserve trailing slash so /api/docs/ -> http://127.0.0.1:4000/docs/
        proxy_pass         http://127.0.0.1:4000/docs/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Avoid caching definition file while iterating
        add_header Cache-Control "no-store";
    }
}

