openapi: 3.0.3
info:
  title: Captive Portal Omada/Radiusdesk API
  version: 0.1.0
  description: >-
    Backend API powering the Omada/Radiusdesk captive portal. All responses are JSON and
    instrumented for PM2 deployments.
servers:
  - url: http://localhost:4000
    description: Local dev
  - url: https://lab.techzone.lat/portal-api
    description: Lab environment
tags:
  - name: dynamic
  - name: auth
  - name: usage
  - name: social
  - name: omada
  - name: radiusdesk-proxy
  - name: admin
security:
  - RadiusToken: []
components:
  securitySchemes:
    RadiusToken:
      type: apiKey
      in: query
      name: token
      description: RadiusDesk Access Provider token (paired with cloud_id query parameter).
    OmadaSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Omada controller session cookie used after `/hotspot/login`.
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: uuid
      description: Operator session token issued by `/api/admin/login`.
  schemas:
    DynamicGalleryItem:
      type: object
      properties:
        file_name:
          type: string
        layout:
          type: string
        width:
          type: integer
        height:
          type: integer
    DynamicPage:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
    DynamicClientInfo:
      type: object
      properties:
        userAgent: { type: string }
        isMobile: { type: boolean }
    DynamicSettings:
      type: object
      properties:
        show_logo: { type: boolean }
        show_name: { type: boolean }
        name_colour: { type: string }
        show_screen_delay: { type: integer }
        available_languages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              value: { type: string }
    DynamicDetail:
      type: object
      properties:
        detail:
          type: object
        settings:
          $ref: '#/components/schemas/DynamicSettings'
        photos:
          type: array
          items:
            $ref: '#/components/schemas/DynamicGalleryItem'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/DynamicPage'
        client_info:
          $ref: '#/components/schemas/DynamicClientInfo'
    PermanentUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        profile: { type: string }
    Voucher:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        expire: { type: string, format: date }
    RadacctSession:
      type: object
      properties:
        radacctid: { type: integer }
        username: { type: string }
        acctstarttime: { type: string, format: date-time }
        acctstoptime: { type: string, format: date-time, nullable: true }
        framedipaddress: { type: string }
    UsageStats:
      type: object
      properties:
        username: { type: string }
        mac: { type: string, nullable: true }
        dataUsed: { type: number }
        dataCap: { type: number, nullable: true }
        timeUsed: { type: number }
        timeCap: { type: number, nullable: true }
        depleted: { type: boolean }
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/RadacctSession'
    UsagePeriodSummary:
      type: object
      properties:
        period:
          type: string
          enum: [hourly, daily, weekly, monthly]
        totalBytes:
          type: number
          description: Aggregated input+output octets within the rolling window.
        totalTimeSeconds:
          type: number
          description: Total session duration in seconds within the window.
        sessionCount: { type: integer }
    UsageByUsernameSummary:
      type: object
      properties:
        username: { type: string }
        historyLimit:
          type: integer
          description: Number of recent sessions inspected.
        macs:
          type: array
          items: { type: string }
        periods:
          type: array
          items:
            $ref: '#/components/schemas/UsagePeriodSummary'
    SessionList:
      type: object
      properties:
        username: { type: string }
        totalCount: { type: integer }
        radiusdeskTotal:
          type: integer
          description: Total count returned by RadiusDesk prior to filtering.
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/RadacctSession'
    AdminAuthModes:
      type: object
      properties:
        availableModes:
          type: array
          items:
            type: string
            enum: [static, radiusmysql]
        defaultMode:
          type: string
          nullable: true
          enum: [static, radiusmysql, null]
    AdminLoginResult:
      type: object
      properties:
        token:
          type: string
          format: uuid
        expiresAt:
          type: integer
          format: int64
          description: Epoch milliseconds when the token expires.
        mode:
          type: string
          enum: [static, radiusmysql]
    AdminSession:
      type: object
      properties:
        username: { type: string }
        mode:
          type: string
          enum: [static, radiusmysql]
    RouterUsageStat:
      type: object
      properties:
        label: { type: string }
        totalBytes: { type: number }
        totalTimeSeconds: { type: number }
        sessionCount: { type: integer }
    AdminUserInsights:
      type: object
      properties:
        username: { type: string }
        macs:
          type: array
          items: { type: string }
        historyLimit: { type: integer }
        periods:
          type: array
          items:
            $ref: '#/components/schemas/UsagePeriodSummary'
        activeSessions:
          type: array
          items:
            $ref: '#/components/schemas/RadacctSession'
        inactiveSessions:
          type: array
          items:
            $ref: '#/components/schemas/RadacctSession'
        activeCount: { type: integer }
        inactiveCount: { type: integer }
        routerStats:
          type: array
          items:
            $ref: '#/components/schemas/RouterUsageStat'
        lastUpdated:
          type: string
          format: date-time
    OmadaAuthPayload:
      type: object
      properties:
        clientMac: { type: string }
        site: { type: string }
        radioId: { type: integer }
        time: { type: integer }
        redirectUrl: { type: string }
        apMac: { type: string }
        gatewayMac: { type: string }
        ssidName: { type: string }
        vid: { type: integer }
        accessToken: { type: string }
    OmadaLoginResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            token: { type: string }
    ConnectResult:
      type: object
      properties:
        status:
          type: string
          enum: [accepted, pending, rejected]
        message: { type: string }
        nextRedirect: { type: string }
        omadaSite: { type: string }
        username: { type: string }
        mac: { type: string }
        requestId: { type: string }
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message: { type: string }
        status: { type: integer }
paths:
  /api/dynamic/details:
    get:
      tags: [dynamic, radiusdesk-proxy]
      summary: Proxy to RadiusDesk dynamic details
      description: >
        Pass-through to `/dynamic-details/info-for.json` including every Omada query parameter.
        Responses are cached for 15 seconds and expose the cache decision via `x-cache-status`.
        When RadiusDesk reports `success=false`, the same status is surfaced so that the client can
        block the connection attempt and show the available keys.
      operationId: listDynamicDetails
      parameters:
        - in: query
          name: clientMac
          schema: { type: string }
        - in: query
          name: key
          schema: { type: string }
        - in: query
          name: lang
          schema: { type: string }
          description: Optional language override forwarded to RadiusDesk.
      responses:
        '200':
          description: Dynamic detail
          headers:
            x-cache-status:
              description: HIT when served from cache, MISS when fetched from RadiusDesk.
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DynamicDetail'
              examples:
                success:
                  value:
                    success: true
                    data:
                      detail:
                        name: Hotel Techzone
                      settings:
                        show_logo: true
                        available_languages:
                          - { id: fr, value: Français }
                invalidKey:
                  value:
                    success: false
                    data:
                      key: invalid
                    message: 'Dynamic key not found'
        '400':
          description: Invalid key or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingKey:
                  value:
                    success: false
                    message: Dynamic key is missing
                    status: 400
        '401':
          description: RadiusDesk token rejected (RBA, realm mismatch, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: RadiusDesk unreachable or internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/connect/{mode}:
    post:
      tags: [auth, omada]
      summary: Authenticate a client session and push authorization to Omada
      description: Validate the user/voucher/click context against RadiusDesk and request Omada authorization.
      operationId: connectClient
      parameters:
        - in: path
          name: mode
          required: true
          schema:
            type: string
            enum: [permanent, voucher, click, social]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                voucherCode: { type: string }
                dynamicKey: { type: string }
                mac: { type: string }
                omada:
                  $ref: '#/components/schemas/OmadaAuthPayload'
            examples:
              permanent:
                value:
                  username: user@example.com
                  password: secret
                  mac: AA-BB-CC-00-11-22
                  omada:
                    clientMac: AA-BB-CC-00-11-22
                    site: 22ccb98d-44
                    radioId: 1
                    time: 1731512254
                    authType: 4
                    redirectUrl: https://portal/success
      responses:
        '200':
          description: Result of the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectResult'
              examples:
                voucher:
                  value:
                    status: accepted
                    message: Access granted
                    nextRedirect: https://portal/success
                    omadaSite: 22ccb98d-44
                    username: VCHR-1001
                    mac: AA-BB-CC-00-11-22
                    requestId: req_123
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                missingUser:
                  value:
                    success: false
                    message: username required
                    status: 400
        '401':
          description: RadiusDesk token/ACL denied or Omada session invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Omada authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/usage:
    get:
      tags: [usage, radiusdesk-proxy]
      summary: Aggregate usage for a user
      description: >
        Combine RadiusDesk quota information with the most recent session list for the client.
        When the upstream usage API returns no stats (typical for fresh accounts), the service responds
        with zeroed counters and an empty sessions array. If you omit the `mac` query parameter the backend
        automatically fetches the latest sessions to derive it before calling RadiusDesk (you can still append
        `?mac=` manually to override).
      operationId: getUsageStats
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: password
          required: true
          schema:
            type: string
            format: password
          description: User or voucher password; required to validate the usage lookup.
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
        - in: query
          name: withSessions
          schema:
            type: boolean
            default: true
          description: When false, skip fetching session history and only return aggregate usage.
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageStats'
              examples:
                usage:
                  value:
                    success: true
                    data:
                      username: user@example.com
                      mac: AA-BB-CC-00-11-22
                      dataUsed: 2048
                      dataCap: 4096
                      timeUsed: 1800
                      timeCap: 7200
                      depleted: false
                      sessions:
                        - radacctid: 123
                          username: user@example.com
                          acctstarttime: 2024-11-01T10:00:00Z
                          acctstoptime: null
                          framedipaddress: 10.0.0.12
                freshAccount:
                  value:
                    success: true
                    data:
                      username: admin@dev
                      mac: AA-BB-CC-00-11-22
                      dataUsed: 0
                      dataCap: null
                      timeUsed: 0
                      timeCap: null
                      depleted: false
                      sessions: []
        '400':
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/admin/auth-modes:
    get:
      tags: [admin]
      summary: List operator authentication modes
      description: Returns the configured admin authentication sources (static credentials or RadiusDesk MySQL user).
      operationId: listAdminAuthModes
      responses:
        '200':
          description: Available modes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminAuthModes'
        '503':
          description: Admin authentication not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/admin/login:
    post:
      tags: [admin]
      summary: Authenticate an operator and issue a bearer token
      operationId: loginAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string, format: password }
                mode:
                  type: string
                  enum: [static, radiusmysql]
            examples:
              static:
                value:
                  username: admin
                  password: secret
                  mode: static
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminLoginResult'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Mode not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/admin/me:
    get:
      tags: [admin]
      summary: Retrieve the active admin session
      security:
        - AdminToken: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminSession'
        '401':
          description: Missing or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/admin/logout:
    post:
      tags: [admin]
      summary: Revoke the admin token
      security:
        - AdminToken: []
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          description: Missing or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/admin/users/{username}/insights:
    get:
      tags: [admin, usage]
      summary: Operator-only usage insights for a username
      description: Aggregates usage summaries, router stats and recent sessions without requiring the user password.
      operationId: getAdminUserInsights
      security:
        - AdminToken: []
      parameters:
        - in: path
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: historyLimit
          schema:
            type: integer
            minimum: 50
            maximum: 500
          description: Optional override for the amount of historical sessions inspected.
      responses:
        '200':
          description: Usage insights
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminUserInsights'
        '401':
          description: Missing token or RadiusDesk authentication failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Username not found or unable to determine MAC address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: RadiusDesk timeout or aggregation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/usage-by-username:
    get:
      tags: [usage, radiusdesk-proxy]
      summary: Aggregate usage without requiring a MAC address
      description: >
        Inspect recent RadiusDesk accounting entries for the user and compute rolling totals for the last hour,
        day, week, and month. Unlike `/api/usage`, this endpoint does not require the client MAC because the backend
        derives it from session history.
      operationId: getUsageByUsername
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: historyLimit
          schema: { type: integer, default: 200 }
          description: Number of recent sessions to inspect (50-500).
      responses:
        '200':
          description: Aggregated usage windows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UsageByUsernameSummary'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/active-sessions:
    get:
      tags: [usage, radiusdesk-proxy]
      summary: List active sessions for a user
      description: Wrapper around RadiusDesk `radaccts/index.json` with `only_connected=true`.
      operationId: getActiveSessions
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
          description: Maximum number of active sessions to return (1-200).
      responses:
        '200':
          description: Active session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionList'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/inactive-sessions:
    get:
      tags: [usage, radiusdesk-proxy]
      summary: List recently closed sessions for a user
      description: >
        Fetch recent RadiusDesk accounting entries and filter the results to sessions that already have an
        `acctstoptime`. Use this to show historical activity alongside the active session list.
      operationId: getInactiveSessions
      parameters:
        - in: query
          name: username
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: Maximum number of inactive sessions to return (1-200).
      responses:
        '200':
          description: Inactive session list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionList'
        '400':
          description: Missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/usage/disconnect:
    post:
      tags: [usage]
      summary: Disconnect active sessions using RadiusDesk kick
      description: Calls RadiusDesk `kick-active` to close the selected session IDs.
      operationId: disconnectSessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                radacctIds:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Disconnect request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: RadiusDesk access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: RadiusDesk kick endpoint failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/social/{provider}/start:
    get:
      tags: [social]
      summary: Begin the OAuth/OIDC handshake for dynamic social providers
      description: Returns the provider-specific authorization URL and state token.
      operationId: startSocialAuth
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
              examples:
                facebook:
                  value:
                    success: true
                    data:
                      provider: facebook
                      authorizationUrl: https://auth/facebook?state=req_123
        '400':
          description: Unsupported provider or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Social login disabled for the dynamic profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Social provider bootstrap failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/social/{provider}/callback:
    get:
      tags: [social]
      summary: Callback endpoint storing state before connect/social
      description: Validates the OAuth callback and relays state back to the frontend flow.
      operationId: handleSocialCallback
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Callback acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: Missing OAuth state or provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Social login disabled for the dynamic profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal callback processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /healthz:
    get:
      tags: [omada]
      summary: Liveness probe
      description: Simple liveness check reporting whether the backend process is running.
      operationId: getHealth
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '500':
          description: Backend initialization failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /readyz:
    get:
      tags: [omada, radiusdesk-proxy]
      summary: Checks Omada session and RadiusDesk cache
      description: Ensures RadiusDesk+Omada dependencies are reachable and cached credentials are valid.
      operationId: getReadiness
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '503':
          description: Dependencies unavailable (Omada or RadiusDesk down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /metrics:
    get:
      tags: [omada]
      summary: Prometheus metrics endpoint
      description: Exposes prom-client metrics for scraping by observability platforms.
      operationId: getMetrics
      responses:
        '200':
          description: Prom metrics
          content:
            text/plain:
              schema:
                type: string
        '503':
          description: Metrics registry unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

x-externalDocs:
  radiusdesk:
    description: Reference payloads for the upstream RadiusDesk APIs.
    resources:
