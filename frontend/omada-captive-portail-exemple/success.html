<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadiusDesk Session Info</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="portal-header">
        <img id="logo" src="" alt="Logo" class="logo hidden" />
        <div>
          <h1 id="brandName">Loading…</h1>
          <p id="brandSubtitle"></p>
        </div>
      </header>

      <section id="alerts">
        <div id="alertWarn" class="alert alert-warning hidden"></div>
        <div id="alertInfo" class="alert alert-info hidden"></div>
      </section>

      <section class="card" id="waitingCard">
        <h2 id="successTitle">Connexion validée</h2>
        <p id="successSubtitle">Veuillez patienter avant d’ouvrir l’espace Info Conso.</p>
        <div class="countdown" aria-live="polite">
          <span id="countdownValue">15</span>s
        </div>
        <p id="countdownHint"></p>
      </section>

      <section class="card hidden" id="ctaCard">
        <h2 id="infoReadyTitle">Info Conso</h2>
        <p id="infoReadySubtitle">Votre tableau de bord s’ouvre dans un nouvel onglet sécurisé.</p>
        <div class="actions-stack">
          <button id="btnOpenInfo" type="button">Ouvrir l’info conso</button>
          <a id="infoLink" href="#" target="_blank" rel="noopener" class="link-button">Ouvrir dans un nouvel onglet</a>
        </div>
      </section>

      <footer id="footer" class="portal-footer">
        <p id="footerText"></p>
      </footer>
    </div>

    <script src="assets/js/portal-utils.js"></script>
    <script src="assets/js/success.js"></script>
  </body>
</html>
