<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadiusDesk Omada Portal</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="portal" class="container">
      <header class="portal-header">
        <img id="logo" src="" alt="Logo" class="logo hidden" />
        <div>
          <h1 id="brandName">Loading…</h1>
          <p id="brandSubtitle"></p>
        </div>
      </header>

      <section id="alerts">
        <div id="alertWarn" class="alert alert-warning hidden"></div>
        <div id="alertInfo" class="alert alert-info hidden"></div>
      </section>

      <section class="card" id="loginCard">
        <div class="login-tabs" role="tablist">
          <button type="button" class="login-tab active" data-mode="user" id="tabUser">Utilisateur</button>
          <button type="button" class="login-tab" data-mode="voucher" id="tabVoucher">Voucher</button>
        </div>
        <form id="loginForm">
          <div class="mode-panel" data-mode="user">
            <div class="form-group">
              <label for="username">Identifiant</label>
              <input type="text" id="username" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label for="password">Mot de passe</label>
              <input type="password" id="password" autocomplete="current-password" required />
            </div>
          </div>

          <div class="mode-panel hidden" data-mode="voucher">
            <div class="form-group">
              <label for="voucherCode">Code voucher</label>
              <input type="text" id="voucherCode" autocomplete="off" />
            </div>
          </div>

          <p class="consent" id="consentText">
            En vous connectant vous acceptez les conditions d'utilisation.
          </p>
          <button id="btnConnect" type="submit">Connexion</button>
        </form>
      </section>

      <footer id="footer" class="portal-footer">
        <p id="footerText"></p>
      </footer>
    </div>

    <script src="assets/js/portal-utils.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
